<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Gerador de Propostas</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #f8f8f8;
            color: #333;
        }

        .jarvis-app {
            min-height: 100vh;
            background: #f8f8f8;
        }

        .screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Welcome Screen */
        .welcome-screen {
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
        }

        .welcome-content {
            text-align: center;
            max-width: 500px;
        }

        .welcome-title {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        .welcome-subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .welcome-company {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 40px;
            font-weight: 600;
        }

        /* Form Screen */
        .form-screen {
            background: #ffffff;
            min-height: auto;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .form-container {
            width: 100%;
            max-width: 600px;
            background: white;
        }

        .form-container h2 {
            margin-bottom: 30px;
            font-size: 1.5rem;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }

        .input-field,
        .textarea-field {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .input-field:focus,
        .textarea-field:focus {
            outline: none;
            border-color: #333;
        }

        .textarea-field {
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary,
        .btn-secondary {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1a1a1a;
            color: white;
        }

        .btn-primary:hover {
            background: #333;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .btn-lg {
            padding: 14px 40px;
            font-size: 1.1rem;
            width: 100%;
        }

        .btn-remove {
            background: #ffebee;
            color: #c62828;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .proposals-section {
            margin: 30px 0;
            padding: 20px;
            background: #fafafa;
            border-radius: 8px;
        }

        .proposal-card {
            background: white;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
        }

        .proposal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .form-actions {
                grid-template-columns: 1fr;
            }
        }

        /* Preview Screen */
        .preview-screen {
            background: #f5f5f5;
            min-height: auto;
            align-items: flex-start;
            padding-top: 20px;
            padding-bottom: 20px;
        }

        .preview-controls {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 20px;
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .preview-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* PDF Content */
        .pdf-content {
            background: white;
            padding: 60px 50px;
            min-height: 100vh;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1rem;
            line-height: 1.6;
            color: #333;
        }

        @media (max-width: 768px) {
            .pdf-content {
                padding: 40px 25px;
                font-size: 0.95rem;
            }
        }

        .pdf-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 20px;
        }

        .pdf-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .pdf-subheader {
            font-size: 0.95rem;
            color: #666;
            font-weight: normal;
        }

        .pdf-info {
            margin-bottom: 30px;
            background: #e8f1ff;
            padding: 20px;
            border-radius: 6px;
        }

        .info-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 15px;
        }

        .info-label {
            display: block;
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
        }

        .info-value {
            display: block;
            color: #333;
            font-size: 1rem;
        }

        .pdf-section {
            margin-bottom: 30px;
        }

        .pdf-section h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .pdf-text {
            color: #555;
            line-height: 1.7;
        }

        .proposal-value {
            background: #f0f0f0;
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .pdf-footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }

        .api-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .api-modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
        }

        .api-modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function JarvisApp() {
            const companyInfo = {
                name: 'Loyal Films',
                cnpj: '57.324.207/0001-39',
                city: 'Santa Maria de Jetibá, ES',
                phone: '(27) 99606-8721',
                insta: '@victorkiefer',
                email: 'vickleal568@gmail.com'
            };

            const [screen, setScreen] = useState('welcome');
            const [apiKey, setApiKey] = useState(localStorage.getItem('anthropic_api_key') || '');
            const [showApiModal, setShowApiModal] = useState(false);
            const [loading, setLoading] = useState(false);

            const [formData, setFormData] = useState({
                emissionDate: new Date().toISOString().split('T')[0],
                clientName: '',
                clientDocument: '',
                clientContact: '',
                eventBriefing: '',
                proposals: [
                    { id: 1, packageName: '', value: '', deliveryScope: '' }
                ],
                observations: '',
                discountPercent: 0
            });

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            const handleProposalChange = (proposalId, field, value) => {
                setFormData(prev => ({
                    ...prev,
                    proposals: prev.proposals.map(p =>
                        p.id === proposalId ? { ...p, [field]: value } : p
                    )
                }));
            };

            const addProposal = () => {
                const nextId = Math.max(...formData.proposals.map(p => p.id), 0) + 1;
                setFormData(prev => ({
                    ...prev,
                    proposals: [
                        ...prev.proposals,
                        { id: nextId, packageName: '', value: '', deliveryScope: '' }
                    ]
                }));
            };

            const removeProposal = (proposalId) => {
                if (formData.proposals.length > 1) {
                    setFormData(prev => ({
                        ...prev,
                        proposals: prev.proposals.filter(p => p.id !== proposalId)
                    }));
                }
            };

            const formatCurrency = (value) => {
                return new Intl.NumberFormat('pt-BR', {
                    style: 'currency',
                    currency: 'BRL'
                }).format(value || 0);
            };

            const formalizeText = async (text, type = 'brief') => {
                if (!apiKey) {
                    setShowApiModal(true);
                    return null;
                }

                const systemPrompts = {
                    brief: 'Você é um assistente de comunicação empresarial. Receba a descrição informal a seguir e reescreva-a de forma objetiva, profissional e clara, adequada para uma proposta comercial formal. Mantenha todas as informações relevantes, elimine gírias e informalidades, e use linguagem direta e institucional. Retorne apenas o texto reformulado, sem comentários adicionais.',
                    scope: 'Você é um assistente de comunicação empresarial. Receba a lista de entregas descrita de forma informal e reestruture-a em um escopo claro e profissional, com pontos numerados. Use linguagem direta, padronizada e institucional. Retorne apenas o texto formatado, sem comentários adicionais.'
                };

                setLoading(true);
                try {
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': apiKey
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 1000,
                            system: systemPrompts[type],
                            messages: [
                                { role: 'user', content: text }
                            ]
                        })
                    });

                    if (!response.ok) {
                        alert('Erro na API. Verifique sua chave.');
                        return null;
                    }

                    const data = await response.json();
                    return data.content[0].text;
                } catch (error) {
                    alert('Erro ao conectar com a IA: ' + error.message);
                    return null;
                } finally {
                    setLoading(false);
                }
            };

            const handleFormalizeClick = async (proposalId, type) => {
                if (type === 'brief') {
                    if (!formData.eventBriefing.trim()) {
                        alert('Preencha o briefing do evento primeiro');
                        return;
                    }
                    const formalized = await formalizeText(formData.eventBriefing, 'brief');
                    if (formalized) {
                        setFormData(prev => ({
                            ...prev,
                            eventBriefing: formalized
                        }));
                    }
                } else if (type === 'scope') {
                    const proposal = formData.proposals.find(p => p.id === proposalId);
                    if (!proposal?.deliveryScope.trim()) {
                        alert('Preencha o escopo de entrega primeiro');
                        return;
                    }
                    const formalized = await formalizeText(proposal.deliveryScope, 'scope');
                    if (formalized) {
                        handleProposalChange(proposalId, 'deliveryScope', formalized);
                    }
                }
            };

            const handleApiKeySave = () => {
                localStorage.setItem('anthropic_api_key', apiKey);
                setShowApiModal(false);
            };

            const generatePDF = async () => {
                const element = document.getElementById('pdf-content');
                try {
                    const canvas = await html2canvas(element, { scale: 2, useCORS: true });
                    const imgData = canvas.toDataURL('image/png');
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pageHeight = pdf.internal.pageSize.getHeight();
                    const pageWidth = pdf.internal.pageSize.getWidth();
                    const imgHeight = (canvas.height * pageWidth) / canvas.width;
                    
                    let heightLeft = imgHeight;
                    let position = 0;

                    pdf.addImage(imgData, 'PNG', 0, position, pageWidth, imgHeight);
                    heightLeft -= pageHeight;

                    while (heightLeft > 0) {
                        position = heightLeft - imgHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, 'PNG', 0, position, pageWidth, imgHeight);
                        heightLeft -= pageHeight;
                    }

                    const filename = `Proposta_CoberturAudiovisual_${formData.clientName}_${formData.emissionDate}.pdf`;
                    pdf.save(filename);
                } catch (error) {
                    alert('Erro ao gerar PDF: ' + error.message);
                }
            };

            return (
                <div className="jarvis-app">
                    {screen === 'welcome' && (
                        <div className="screen welcome-screen">
                            <div className="welcome-content">
                                <h1 className="welcome-title">JARVIS</h1>
                                <p className="welcome-subtitle">Gerador de Propostas de Cobertura Audiovisual</p>
                                <p className="welcome-company">Loyal Films</p>
                                <button 
                                    className="btn-primary btn-lg"
                                    onClick={() => setScreen('form')}
                                >
                                    INICIAR
                                </button>
                            </div>
                        </div>
                    )}

                    {screen === 'form' && (
                        <div className="screen form-screen">
                            <div className="form-container">
                                <h2>Nova Proposta de Cobertura Audiovisual</h2>

                                <div className="form-group">
                                    <label>Data de Emissão</label>
                                    <input
                                        type="date"
                                        name="emissionDate"
                                        value={formData.emissionDate}
                                        onChange={handleInputChange}
                                        className="input-field"
                                    />
                                </div>

                                <div className="form-group">
                                    <label>Nome do Cliente</label>
                                    <input
                                        type="text"
                                        name="clientName"
                                        placeholder="Pessoa Física ou Razão Social"
                                        value={formData.clientName}
                                        onChange={handleInputChange}
                                        className="input-field"
                                    />
                                </div>

                                <div className="form-row">
                                    <div className="form-group">
                                        <label>CPF / CNPJ (opcional)</label>
                                        <input
                                            type="text"
                                            name="clientDocument"
                                            placeholder="000.000.000-00"
                                            value={formData.clientDocument}
                                            onChange={handleInputChange}
                                            className="input-field"
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Contato (opcional)</label>
                                        <input
                                            type="text"
                                            name="clientContact"
                                            placeholder="(xx) xxxxx-xxxx"
                                            value={formData.clientContact}
                                            onChange={handleInputChange}
                                            className="input-field"
                                        />
                                    </div>
                                </div>

                                <div className="form-group">
                                    <label>Briefing do Evento</label>
                                    <textarea
                                        name="eventBriefing"
                                        placeholder="Descreva o evento de forma livre..."
                                        value={formData.eventBriefing}
                                        onChange={handleInputChange}
                                        className="textarea-field"
                                        rows="4"
                                    />
                                    <button
                                        className="btn-secondary btn-sm"
                                        onClick={() => handleFormalizeClick(null, 'brief')}
                                        disabled={loading}
                                    >
                                        {loading ? '⏳ Formalizando...' : '✦ Formalizar com IA'}
                                    </button>
                                </div>

                                <div className="proposals-section">
                                    <h3>Propostas de Pacotes</h3>
                                    
                                    {formData.proposals.map((proposal, index) => (
                                        <div key={proposal.id} className="proposal-card">
                                            <div className="proposal-header">
                                                <h4>Proposta {String(index + 1).padStart(2, '0')}</h4>
                                                {formData.proposals.length > 1 && (
                                                    <button
                                                        className="btn-remove"
                                                        onClick={() => removeProposal(proposal.id)}
                                                    >
                                                        ✕
                                                    </button>
                                                )}
                                            </div>

                                            <div className="form-group">
                                                <label>Nome do Pacote</label>
                                                <input
                                                    type="text"
                                                    placeholder="Ex: Cobertura Padrão"
                                                    value={proposal.packageName}
                                                    onChange={(e) => handleProposalChange(proposal.id, 'packageName', e.target.value)}
                                                    className="input-field"
                                                />
                                            </div>

                                            <div className="form-group">
                                                <label>Valor (R$)</label>
                                                <input
                                                    type="number"
                                                    placeholder="0.00"
                                                    value={proposal.value}
                                                    onChange={(e) => handleProposalChange(proposal.id, 'value', e.target.value)}
                                                    className="input-field"
                                                />
                                            </div>

                                            <div className="form-group">
                                                <label>Escopo de Entrega</label>
                                                <textarea
                                                    placeholder="Descreva o que será entregue..."
                                                    value={proposal.deliveryScope}
                                                    onChange={(e) => handleProposalChange(proposal.id, 'deliveryScope', e.target.value)}
                                                    className="textarea-field"
                                                    rows="3"
                                                />
                                                <button
                                                    className="btn-secondary btn-sm"
                                                    onClick={() => handleFormalizeClick(proposal.id, 'scope')}
                                                    disabled={loading}
                                                >
                                                    {loading ? '⏳ Formalizando...' : '✦ Formalizar com IA'}
                                                </button>
                                            </div>
                                        </div>
                                    ))}

                                    {formData.proposals.length < 3 && (
                                        <button
                                            className="btn-secondary"
                                            onClick={addProposal}
                                        >
                                            + Adicionar Proposta {String(formData.proposals.length + 1).padStart(2, '0')}
                                        </button>
                                    )}
                                </div>

                                <div className="form-group">
                                    <label>Desconto para Pagamento Antecipado (%)</label>
                                    <input
                                        type="number"
                                        name="discountPercent"
                                        placeholder="0"
                                        value={formData.discountPercent}
                                        onChange={handleInputChange}
                                        className="input-field"
                                    />
                                </div>

                                <div className="form-group">
                                    <label>Observações (opcional)</label>
                                    <textarea
                                        name="observations"
                                        placeholder="Termos ou informações adicionais..."
                                        value={formData.observations}
                                        onChange={handleInputChange}
                                        className="textarea-field"
                                        rows="3"
                                    />
                                </div>

                                <div className="form-actions">
                                    <button
                                        className="btn-secondary"
                                        onClick={() => setScreen('welcome')}
                                    >
                                        Cancelar
                                    </button>
                                    <button
                                        className="btn-primary"
                                        onClick={() => setScreen('preview')}
                                    >
                                        Visualizar Proposta
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {screen === 'preview' && (
                        <div className="screen preview-screen">
                            <div className="preview-controls">
                                <button
                                    className="btn-secondary"
                                    onClick={() => setScreen('form')}
                                >
                                    ← Editar
                                </button>
                                <button
                                    className="btn-primary"
                                    onClick={generatePDF}
                                >
                                    ⬇ Baixar PDF
                                </button>
                            </div>

                            <div className="preview-container">
                                <div id="pdf-content" className="pdf-content">
                                    <div className="pdf-header">
                                        <h1>{companyInfo.name}</h1>
                                        <p className="pdf-subheader">PROPOSTA DE COBERTURA AUDIOVISUAL DE EVENTO</p>
                                    </div>

                                    <div className="pdf-info">
                                        <div className="info-row">
                                            <div>
                                                <span className="info-label">Data de Emissão:</span>
                                                <span className="info-value">{new Date(formData.emissionDate).toLocaleDateString('pt-BR')}</span>
                                            </div>
                                            <div>
                                                <span className="info-label">Validade:</span>
                                                <span className="info-value">15 dias</span>
                                            </div>
                                        </div>

                                        <div className="info-row">
                                            <div>
                                                <span className="info-label">Cliente:</span>
                                                <span className="info-value">{formData.clientName || '—'}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="pdf-section">
                                        <p className="pdf-text" style={{fontStyle: 'italic', color: '#666'}}>
                                            Esta proposta foi personalizada especialmente para o cliente e não poderá ser transferida ou utilizada por terceiros sem autorização prévia da Loyal Films.
                                        </p>
                                    </div>

                                    {formData.eventBriefing && (
                                        <div className="pdf-section">
                                            <h3>Sobre o Evento</h3>
                                            <p className="pdf-text">{formData.eventBriefing}</p>
                                        </div>
                                    )}

                                    {formData.proposals.map((proposal, index) => (
                                        <div key={proposal.id} className="pdf-section">
                                            <h3>Proposta {String(index + 1).padStart(2, '0')} {proposal.packageName && `— ${proposal.packageName}`}</h3>
                                            {proposal.value && (
                                                <div className="proposal-value">
                                                    <strong>Valor: {formatCurrency(proposal.value)}</strong>
                                                </div>
                                            )}
                                            {proposal.deliveryScope && (
                                                <div className="pdf-section">
                                                    <strong>Escopo de Entrega:</strong>
                                                    <p className="pdf-text">{proposal.deliveryScope}</p>
                                                </div>
                                            )}
                                        </div>
                                    ))}

                                    {formData.observations && (
                                        <div className="pdf-section">
                                            <h3>Observações</h3>
                                            <p className="pdf-text">{formData.observations}</p>
                                        </div>
                                    )}

                                    <div className="pdf-section">
                                        <h3>Sobre a Entrega</h3>
                                        <p className="pdf-text">
                                            A entrega do material completo via link de download será realizada em até 7 dias úteis após a data de captação. Cada pacote já contempla integralmente as diárias dos profissionais envolvidos, transporte e equipamentos — sem custos adicionais para o contratante.
                                        </p>
                                    </div>

                                    <div className="pdf-section">
                                        <h3>Condições de Pagamento</h3>
                                        <p className="pdf-text">
                                            O pagamento é realizado em duas etapas: 50% de entrada para reserva da data, e os 50% restantes antes da entrega total do material. Para pagamento integral antecipado — realizado antes do evento — o contratante tem direito a {formData.discountPercent || '___'}% de desconto no valor total do pacote escolhido.
                                        </p>
                                    </div>

                                    <div className="pdf-footer">
                                        <p>Esta proposta é válida por 15 dias a partir da data de emissão.</p>
                                        <p>{companyInfo.name} | CNPJ: {companyInfo.cnpj}</p>
                                        <p>{companyInfo.city} | {companyInfo.phone}</p>
                                        <p>{companyInfo.insta} | {companyInfo.email}</p>
                                        <p style={{marginTop: '15px'}}>Emitido em: {new Date(formData.emissionDate).toLocaleDateString('pt-BR')}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showApiModal && (
                        <div className="api-modal">
                            <div className="api-modal-content">
                                <h3>Chave da API Anthropic</h3>
                                <p>Cole sua chave para usar a formalização com IA:</p>
                                <input
                                    type="password"
                                    value={apiKey}
                                    onChange={(e) => setApiKey(e.target.value)}
                                    placeholder="sk-ant-..."
                                    style={{width: '100%', padding: '10px', marginBottom: '20px', border: '1px solid #ddd', borderRadius: '6px'}}
                                />
                                <div className="api-modal-buttons">
                                    <button
                                        className="btn-secondary"
                                        onClick={() => setShowApiModal(false)}
                                    >
                                        Cancelar
                                    </button>
                                    <button
                                        className="btn-primary"
                                        onClick={handleApiKeySave}
                                    >
                                        Salvar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<JarvisApp />, document.getElementById('root'));
    </script>
</body>
</html>
